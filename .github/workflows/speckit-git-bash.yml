name: OpenSpeckit Bash

on:
  push:
    paths:
      - .github/workflows/speckit-git-bash.yml
      - devBenches/devcontainer.test/test-openspeckit-bootstrap.sh
      - devBenches/devcontainer.test/test-speckit-git-feature.sh
      - devBenches/devcontainer.test/test-speckit-git-compat.sh
      - devBenches/devcontainer.test/test-ct-launchers.sh
      - devBenches/base-image/files/openspeckit/setup-openspeckit
      - devBenches/base-image/files/speckit-worktree/**
      - devBenches/base-image/files/claude/commands/opsx/**
      - base-image/files/claude/skills/speckit-clarify/SKILL.md
      - devBenches/base-image/files/ct/ct-functions.zsh
      - devBenches/base-image/upstream-pin.yaml
      - devBenches/base-image/update-upstream.py
      - devBenches/base-image/files/openreposhape/**
      - devBenches/base-image/files/openrepotools/**
      - scripts/setup-estate-commands.sh
      - devcontainer.test/test-setup-estate-commands.sh
      - scripts/setup-workspace-repo.sh
      - devcontainer.test/test-setup-workspace-repo.sh
      - scripts/setup-claude-profiles.sh
      - devcontainer.test/test-claude-profile-skill-install.sh
      - devcontainer.test/test-claude-profile-amendment-11.sh
      - base-image/files/claude-profile
      - base-image/files/claude-usage-guard.sh
      - docs/claude-multi-account-profiles.md
      - README.md
      - scripts/wave-container-shell.sh
      - setup.sh
  pull_request:
    paths:
      - .github/workflows/speckit-git-bash.yml
      - devBenches/devcontainer.test/test-openspeckit-bootstrap.sh
      - devBenches/devcontainer.test/test-speckit-git-feature.sh
      - devBenches/devcontainer.test/test-speckit-git-compat.sh
      - devBenches/devcontainer.test/test-ct-launchers.sh
      - devBenches/base-image/files/openspeckit/setup-openspeckit
      - devBenches/base-image/files/speckit-worktree/**
      - devBenches/base-image/files/claude/commands/opsx/**
      - base-image/files/claude/skills/speckit-clarify/SKILL.md
      - devBenches/base-image/files/ct/ct-functions.zsh
      - devBenches/base-image/upstream-pin.yaml
      - devBenches/base-image/update-upstream.py
      - devBenches/base-image/files/openreposhape/**
      - devBenches/base-image/files/openrepotools/**
      - scripts/setup-estate-commands.sh
      - devcontainer.test/test-setup-estate-commands.sh
      - scripts/setup-workspace-repo.sh
      - devcontainer.test/test-setup-workspace-repo.sh
      - scripts/setup-claude-profiles.sh
      - devcontainer.test/test-claude-profile-skill-install.sh
      - devcontainer.test/test-claude-profile-amendment-11.sh
      - base-image/files/claude-profile
      - base-image/files/claude-usage-guard.sh
      - docs/claude-multi-account-profiles.md
      - README.md
      - scripts/wave-container-shell.sh
      - setup.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CT_FUNCTIONS_FILE: ${{ github.workspace }}/devBenches/base-image/files/ct/ct-functions.zsh
  SPECKIT_WORKTREE_FALLBACK_FILE: ${{ github.workspace }}/devBenches/base-image/files/speckit-worktree/templates/specify/shell/worktrees.sh

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure zsh is available
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi

      - name: Verify runtime prerequisites
        run: |
          git --version
          bash --version | sed -n '1p'
          python3 --version
          zsh --version

      - name: Check the vendored upstream copies against their pin
        run: python3 ./devBenches/base-image/update-upstream.py check

      - name: Run the setup-estate-commands regression test
        run: bash ./devcontainer.test/test-setup-estate-commands.sh

      - name: Run the setup-workspace-repo regression test
        run: bash ./devcontainer.test/test-setup-workspace-repo.sh

      # lane-collision-protocol Amendment 9 adoption act 4b. This suite is the
      # guard on the act's deletion -- that scripts/setup-claude-profiles.sh no
      # longer installs the /lane-swap skill or ensures the SessionStart entry,
      # and that `openRepoTools --install` is the one thing that does. Until
      # this PR nothing in CI ran it, so restoring either writer would have
      # gone green. It is host-run, needs only bash/jq/python3, and is
      # hermetic: it redirects HOME, CLAUDE_PROFILES_HOME and CLAUDE_USER_DIR
      # into its own sandbox.
      - name: Run the lane-swap skill install regression test
        run: bash ./devcontainer.test/test-claude-profile-skill-install.sh

      # opensoft/workBenches#93. This suite audits lane-collision-protocol
      # Amendment 11 (the launcher's window reuse, directory and precedence-4
      # rules) plus the vendored handoff/lane-swap skill's mechanics, against
      # `base-image/files/claude-profile`, `base-image/files/claude-usage-
      # guard.sh`, `docs/claude-multi-account-profiles.md` and the vendored
      # openrepotools skills/commands above. It was written but never wired in
      # here, so real rot against the vendored bytes went uncaught for two
      # pin moves; every assertion that had drifted from the shipped bytes
      # without a genuine gap behind it is retargeted in the suite itself
      # (cited inline as `RETARGETED (opensoft/workBenches#93)`), and every
      # assertion behind a real upstream gap is skipped pending its own issue
      # (`KNOWN GAP, NOT THIS PR'S`, opensoft/openRepoTools#79/#98/#99/#100).
      # Host-run, hermetic (its own $TEST_ROOT, real HOME never touched).
      - name: Run the claude-profile Amendment 11 regression test
        run: bash ./devcontainer.test/test-claude-profile-amendment-11.sh

      - name: Run bootstrap suite
        run: bash ./devBenches/devcontainer.test/test-openspeckit-bootstrap.sh

      - name: Run feature suite
        run: bash ./devBenches/devcontainer.test/test-speckit-git-feature.sh

      - name: Run compatibility suite
        run: bash ./devBenches/devcontainer.test/test-speckit-git-compat.sh

      - name: Run ct launcher suite
        run: bash ./devBenches/devcontainer.test/test-ct-launchers.sh

  git-2-34-1:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Git 2.34.1 feature and compatibility suites
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends git=1:2.34.1-1ubuntu1 git-man=1:2.34.1-1ubuntu1 jq python3 zsh ca-certificates && git --version && test "$(git --version)" = "git version 2.34.1" && bash ./devBenches/devcontainer.test/test-speckit-git-feature.sh && bash ./devBenches/devcontainer.test/test-speckit-git-compat.sh'

  bash-3-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run feature and compatibility suites with Bash 3.2
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            bash:3.2@sha256:241dd7ed99aa1f458b6a74cd200a49dca934d9e29d7a9b7636fe712db275a02b \
            -c 'apk add --no-cache git python3 coreutils jq >/dev/null && bash --version | sed -n "1p" && jq --version && bash ./devBenches/devcontainer.test/test-speckit-git-feature.sh && bash ./devBenches/devcontainer.test/test-speckit-git-compat.sh'
