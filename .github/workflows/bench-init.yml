name: Bench process reaping

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/bench-init.yml
      - scripts/check-bench-init.py
      - devcontainer.test/**
      - devBenches/**
      - sysBenches/**
      - bioBenches/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check parent stacks and negative fixtures
        run: |
          python3 devcontainer.test/test-bench-init.py
          python3 scripts/check-bench-init.py .
