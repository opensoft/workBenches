name: Company credential sync
on:
  push:
    branches: [main, feature/profile-onboarding]
    paths:
      - credential-broker/**
      - scripts/company_sync.py
      - scripts/credential_sync_client.py
      - scripts/credential-sync.*
      - scripts/setup-company-sync.py
      - scripts/setup-profiles.py
      - scripts/setup_profiles.py
      - scripts/setup-workbenches-account.py
      - base-image/Dockerfile
      - base-image/files/claude-profile
      - base-image/files/codex-profile
      - base-image/files/opencode-profile
      - base-image/files/company-profile-sync.sh
      - scripts/lib/company-profile-sync.sh
      - devcontainer.test/test-company-credential-sync.py
      - devcontainer.test/fixtures/company-credential-adapter.py
      - devcontainer.test/docker-compose.yml
      - .github/workflows/company-credential-sync.yml
  pull_request:
    paths:
      - credential-broker/**
      - scripts/company_sync.py
      - scripts/credential_sync_client.py
      - scripts/credential-sync.*
      - scripts/setup-company-sync.py
      - scripts/setup-profiles.py
      - scripts/setup_profiles.py
      - scripts/setup-workbenches-account.py
      - base-image/Dockerfile
      - base-image/files/claude-profile
      - base-image/files/codex-profile
      - base-image/files/opencode-profile
      - base-image/files/company-profile-sync.sh
      - scripts/lib/company-profile-sync.sh
      - devcontainer.test/test-company-credential-sync.py
      - devcontainer.test/fixtures/company-credential-adapter.py
      - devcontainer.test/docker-compose.yml
      - .github/workflows/company-credential-sync.yml
permissions:
  contents: read
jobs:
  broker-client-cpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run declared broker/client/CPC fixture tests
        run: |
          docker compose -p credential-sync-test -f devcontainer.test/docker-compose.yml --profile credential-sync build credential-sync
          docker compose -p credential-sync-test -f devcontainer.test/docker-compose.yml --profile credential-sync run --rm --no-deps credential-sync
      - name: Remove fixture network
        if: always()
        run: docker compose -p credential-sync-test -f devcontainer.test/docker-compose.yml --profile credential-sync down
