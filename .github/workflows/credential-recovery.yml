name: Workstation Setup

on:
  push:
    paths:
      - .github/workflows/credential-recovery.yml
      - bootstrap.sh
      - .gitmodules
      - config/bench-config.json
      - config/credential-requirements.json
      - scripts/plan-setup-credentials.py
      - devcontainer.test/test-setup-credential-plan.py
      - base-image/ai-cli-contract.sh
      - scripts/interactive-setup.sh
      - scripts/setup-workbenches.sh
      - scripts/onboard-ai-profiles.py
      - devcontainer.test/test-git-transport.py
      - devcontainer.test/test-setup-bench-status.sh
      - devcontainer.test/test-compose-ai-profiles.py
      - scripts/lib/azure-cli-runtime.sh
      - scripts/lib/docker-prerequisite.sh
      - devcontainer.test/test-docker-prerequisite.py
      - scripts/setup-azure-cli.sh
      - scripts/backup-ai-profile-credentials-to-kv.sh
      - scripts/restore-opencode-omniroute-from-kv.sh
      - scripts/opencode-omniroute-credential
      - scripts/setup-ai-profiles.sh
      - scripts/setup-credential-recovery.py
      - scripts/recover-vault-credentials.py
      - credential-container/**
      - config/ai-credential-*.example.json
      - devcontainer.test/test-vault-credential-recovery.py
      - devcontainer.test/docker-compose.yml
      - setup.sh
      - devcontainer.test/test-azure-cli-runtime.py
      - devcontainer.test/test-ai-credential-keyvault.sh
      - devcontainer.test/test-opencode-omniroute-credential.sh
      - devcontainer.test/test-setup-ai-credential-recovery.sh
      - devcontainer.test/test-setup-cancel.sh
  pull_request:
    paths:
      - .github/workflows/credential-recovery.yml
      - bootstrap.sh
      - .gitmodules
      - config/bench-config.json
      - config/credential-requirements.json
      - scripts/plan-setup-credentials.py
      - devcontainer.test/test-setup-credential-plan.py
      - base-image/ai-cli-contract.sh
      - scripts/interactive-setup.sh
      - scripts/setup-workbenches.sh
      - scripts/onboard-ai-profiles.py
      - devcontainer.test/test-git-transport.py
      - devcontainer.test/test-setup-bench-status.sh
      - devcontainer.test/test-compose-ai-profiles.py
      - scripts/lib/azure-cli-runtime.sh
      - scripts/lib/docker-prerequisite.sh
      - devcontainer.test/test-docker-prerequisite.py
      - scripts/setup-azure-cli.sh
      - scripts/backup-ai-profile-credentials-to-kv.sh
      - scripts/restore-opencode-omniroute-from-kv.sh
      - scripts/opencode-omniroute-credential
      - scripts/setup-ai-profiles.sh
      - scripts/setup-credential-recovery.py
      - scripts/recover-vault-credentials.py
      - credential-container/**
      - config/ai-credential-*.example.json
      - devcontainer.test/test-vault-credential-recovery.py
      - devcontainer.test/docker-compose.yml
      - setup.sh
      - devcontainer.test/test-azure-cli-runtime.py
      - devcontainer.test/test-ai-credential-keyvault.sh
      - devcontainer.test/test-opencode-omniroute-credential.sh
      - devcontainer.test/test-setup-ai-credential-recovery.sh
      - devcontainer.test/test-setup-cancel.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run setup suites without real secrets or cloud access
        run: |
          python3 devcontainer.test/test-docker-prerequisite.py
          python3 devcontainer.test/test-setup-credential-plan.py
          python3 devcontainer.test/test-git-transport.py
          bash devcontainer.test/test-setup-bench-status.sh
          python3 devcontainer.test/test-compose-ai-profiles.py
          bash devcontainer.test/test-ai-credential-keyvault.sh
          bash devcontainer.test/test-opencode-omniroute-credential.sh
          python3 devcontainer.test/test-vault-credential-recovery.py
          python3 devcontainer.test/test-azure-cli-runtime.py
          bash devcontainer.test/test-setup-ai-credential-recovery.sh
          bash devcontainer.test/test-setup-cancel.sh

  credential-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and smoke-test public credential tools through the test bench
        run: |
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery build credential-bitwarden credential-1password
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps credential-bitwarden
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps credential-1password
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps --entrypoint python3 credential-1password /opt/workbenches/credential_recovery.py --help
