permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run setup suites without real secrets or cloud access
        run: |
          python3 -m py_compile devcontainer.test/test-wsl-workstation-acceptance.py
          python3 devcontainer.test/test-acceptance-pty-drain.py
          python3 devcontainer.test/test-release-automation.py
          python3 scripts/release-validation.py run --root . --suite setup \
            --reports "$RUNNER_TEMP/workstation-setup-evidence"

  tools-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Docker-only bootstrap and managed containers through the test bench
        run: |
          export WORKBENCHES_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export WORKBENCHES_DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
          docker compose -p workbenches-runtime-test -f devcontainer.test/docker-compose.yml --profile tools-runtime build tools-runtime
          docker compose -p workbenches-runtime-test -f devcontainer.test/docker-compose.yml --profile tools-runtime run --rm --no-deps tools-runtime
      - name: Remove test bench network
        if: always()
        run: docker compose -p workbenches-runtime-test -f devcontainer.test/docker-compose.yml --profile tools-runtime down --remove-orphans

  credential-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and smoke-test public credential tools through the test bench
        run: |
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery build credential-bitwarden credential-1password
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps credential-bitwarden
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps credential-1password
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-recovery run --rm --no-deps --entrypoint python3 credential-1password /opt/workbenches/credential_recovery.py --help
          docker compose -f devcontainer.test/docker-compose.yml --profile credential-test build credential-fixture
          python3 devcontainer.test/test-credential-container-guided.py

  component-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise component removal through an isolated Docker engine
        run: docker compose -p workbenches-lifecycle -f devcontainer.test/docker-compose.yml --profile component-lifecycle run --rm component-lifecycle
      - name: Remove disposable engine and data
        if: always()
        run: docker compose -p workbenches-lifecycle -f devcontainer.test/docker-compose.yml --profile component-lifecycle down --volumes --remove-orphans
