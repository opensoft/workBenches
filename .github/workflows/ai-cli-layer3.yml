name: AI CLI and Layer 3 Safety

on:
  push:
    paths:
      - .github/workflows/ai-cli-layer3.yml
      - base-image/Dockerfile
      - base-image/ai-cli-contract.sh
      - base-image/ai-cli-install-helpers.sh
      - base-image/install-ai-clis.sh
      - devBenches/base-image/install-ai-clis.sh
      - devcontainer.test/test-ai-cli-install-summary.sh
      - devcontainer.test/test-ensure-layer3-freshness.sh
      - devcontainer.test/test-layer3-codex-version.sh
      - scripts/ensure-layer3.sh
      - scripts/lib/layer3-recipe.sh
      - user-layer/**
  pull_request:
    paths:
      - .github/workflows/ai-cli-layer3.yml
      - base-image/Dockerfile
      - base-image/ai-cli-contract.sh
      - base-image/ai-cli-install-helpers.sh
      - base-image/install-ai-clis.sh
      - devBenches/base-image/install-ai-clis.sh
      - devcontainer.test/test-ai-cli-install-summary.sh
      - devcontainer.test/test-ensure-layer3-freshness.sh
      - devcontainer.test/test-layer3-codex-version.sh
      - scripts/ensure-layer3.sh
      - scripts/lib/layer3-recipe.sh
      - user-layer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run AI CLI and Layer 3 regression suites
        run: |
          bash devcontainer.test/test-ai-cli-install-summary.sh
          bash devcontainer.test/test-layer3-codex-version.sh
          bash devcontainer.test/test-ensure-layer3-freshness.sh
