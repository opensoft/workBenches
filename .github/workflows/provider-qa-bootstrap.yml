name: Provider QA bootstrap contracts
on:
  pull_request:
    paths:
      - .github/workflows/provider-qa-bootstrap.yml
      - qa/release/provision-provider-qa.py
      - config/qa-provider-slots.json
      - devcontainer.test/test-provider-qa-bootstrap.py
  push:
    branches: [main]
    paths:
      - .github/workflows/provider-qa-bootstrap.yml
      - qa/release/provision-provider-qa.py
      - config/qa-provider-slots.json
      - devcontainer.test/test-provider-qa-bootstrap.py
permissions:
  contents: read
jobs:
  unit:
    runs-on: eagle-linux-ubuntu24
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 devcontainer.test/test-provider-qa-bootstrap.py
