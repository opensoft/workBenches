name: project-command
on:
  push:
    paths: ['scripts/**', 'config/openrepoproject-pin.json', 'devcontainer.test/test-project-command.py', '.github/workflows/project-command.yml']
  pull_request:
    paths: ['scripts/**', 'config/openrepoproject-pin.json', 'devcontainer.test/test-project-command.py', '.github/workflows/project-command.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 devcontainer.test/test-project-command.py
      - run: bash -n scripts/project scripts/onp scripts/new-project.sh scripts/install-workbench-commands.sh scripts/setup-workbenches.sh setup.sh
